<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coding cards</title>
<style>
:root{--bg:#fbfaf7;--panel:#f2f0ea;--ink:#1d1c1a;--muted:#6b6862;--line:#dedad1;--accent:#1a5fb4;--done:#2e8b57;--cur:#e08a00}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--panel:#1f1f1d;--ink:#e9e7e1;--muted:#a19d95;--line:#33322e;--accent:#7fb0ff;--done:#4cc38a;--cur:#ffb340}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer;min-width:40px;font-weight:600}button:hover{border-color:var(--accent);color:var(--accent)}
#prob{flex:1 1 320px;min-width:200px;max-width:620px}
.wrap{max-width:1150px;margin:0 auto;padding:16px 16px 110px}
.head h1{font-size:22px;margin:4px 0 6px;line-height:1.25}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.desc{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin:8px 0 14px}
.desc p{margin:4px 0}.desc .k{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.altbox{background:rgba(26,95,180,.08);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;margin:8px 0 12px;font-size:14px}.altbox a{color:var(--accent);cursor:pointer;text-decoration:underline}
.warn{background:rgba(224,138,0,.12);border:1px solid var(--cur);border-radius:8px;padding:8px 12px;margin:8px 0 12px;font-size:14px}
.card img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.nav2{display:flex;justify-content:space-between;margin-top:12px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.stat{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}.stat b{color:var(--ink)}
.strip{display:flex;gap:2px;height:14px;cursor:pointer}.strip i{flex:1;background:var(--line);border-radius:2px;min-width:2px}
.strip i.done{background:var(--done)}.strip i.cur{background:var(--cur);transform:scaleY(1.4)}.strip i.grp{box-shadow:0 0 0 1px var(--muted) inset}
.mark{font-size:13px;font-weight:500}.mark.on{background:var(--done);border-color:var(--done);color:#fff}
.kbd{font-size:12px;color:var(--muted)}
.rt{font-weight:700;color:#fff;border:0}.r-hi{background:#c0392b}.r-mid{background:#d68910}.r-lo{background:#7f8c8d}
.why{font-size:13px;color:var(--muted);margin:6px 0 0}
.sw{position:relative;flex:1 1 240px;min-width:180px;max-width:360px}
#q{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#q:focus{outline:2px solid var(--accent);outline-offset:0}
#res{position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20}
#res a{display:block;padding:7px 10px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;cursor:pointer}
#res a:last-child{border-bottom:0}#res a.sel,#res a:hover{background:var(--bg)}
#res small{color:var(--muted)}#res mark{background:none;color:var(--accent);font-weight:700}
#res .none{padding:8px 10px;color:var(--muted)}
</style></head><body>
<div class="top">
  <div class="sw"><input id="q" type="search" placeholder="Search problems… ( / )" autocomplete="off"><div id="res" hidden></div></div>
  <select id="deck" title="Deck"></select>
  <select id="minr" title="Filter by likelihood rating"><option value="0">All ratings</option><option value="9">★ 9–10 (hot)</option><option value="7">★ 7+</option><option value="5">★ 5+</option><option value="-4">★ ≤4 (low)</option></select>
  <select id="order" title="Order"><option value="topic">By topic</option><option value="rating">By rating ↓</option></select>
  <select id="topic" title="Jump to topic"></select>
  <button id="prev" title="Previous (←)">‹</button>
  <select id="prob" title="Jump to problem"></select>
  <button id="next" title="Next (→)">›</button>
  <button id="mark" class="mark" title="Mark done (D)">☐ done</button>
  <button id="alts" class="mark" title="Duplicate problems: show the more complex alternate solutions too">alternates: hidden</button>
  <span class="kbd">/ search · ← → navigate · D done</span>
</div>
<div class="wrap">
  <div class="head"><div class="tags" id="tags"></div><h1 id="title"></h1></div>
  <div class="desc" id="desc"></div>
  <div class="card"><img id="img" alt=""></div>
  <div class="nav2"><button id="prev2">‹ Previous</button><button id="next2">Next ›</button></div>
</div>
<div class="bottom">
  <div class="stat"><span id="pos"></span><span id="grp"></span><span id="donec"></span></div>
  <div class="strip" id="strip"></div>
</div>

<script>
const DECKS=JSON.parse(document.getElementById('data').textContent);
const S={get(k,d){try{const v=localStorage.getItem('cards:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('cards:'+k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
DECKS.forEach(d=>d.all=d.cards.slice());
let deck=DECKS.find(d=>d.key===S.get('deck','main'))||DECKS[0], idx=0, minR=+S.get('minr',0), order=S.get('order','topic'), showAlt=!!S.get('alts',false);
const dkey=c=>(c.dk||deck.key)+':'+c.name;
const rcls=r=>r>=8?'r-hi':r>=6?'r-mid':'r-lo';
function applyView(){$('alts').textContent='alternates: '+(showAlt?'shown':'hidden');$('alts').classList.toggle('on',showAlt);
  deck.cards=deck.all.filter(c=>(showAlt||!c.alt_of)&&(minR>=0?(c.rating||0)>=minR:(c.rating||0)<=-minR))
  .sort(order==='rating'?(a,b)=>(b.rating-a.rating)||a.topic.localeCompare(b.topic)||a.name.localeCompare(b.name):(a,b)=>a.topic.localeCompare(b.topic)||a.name.localeCompare(b.name)||(a.dk||'').localeCompare(b.dk||''));
  $('minr').value=String(minR);$('order').value=order}
function done(){return S.get('done',{})}
function fillDeck(){$('deck').innerHTML=DECKS.map(d=>`<option value="${d.key}" ${d===deck?'selected':''}>${esc(d.label)} (${d.all.length})</option>`).join('')}
function fillLists(){
  const topics=[...new Set(deck.cards.map(c=>c.topic))];
  $('topic').innerHTML='<option value="">Topic…</option>'+topics.map(t=>`<option value="${t}">${t} (${deck.cards.filter(c=>c.topic===t).length})</option>`).join('');
  $('prob').innerHTML=topics.map(t=>`<optgroup label="${t}">`+deck.cards.map((c,i)=>c.topic===t?`<option value="${i}">[${c.rating||'–'}] ${esc(c.title)}${c.lc?' · '+esc(c.lc):''}${deck.key==='all'?' · '+esc(c.dl):''}</option>`:'').join('')+'</optgroup>').join('');
  $('strip').innerHTML=deck.cards.map((c,i)=>`<i data-i="${i}" title="${i+1}. ${esc(c.title)}"></i>`).join('');
}
function show(i){
  if(!deck.cards.length){$('title').textContent='No cards match this rating filter';$('desc').innerHTML='';$('tags').innerHTML='';$('img').removeAttribute('src');$('pos').textContent='0 cards';$('grp').textContent='';$('donec').textContent='';return}
  idx=Math.max(0,Math.min(deck.cards.length-1,i)); const c=deck.cards[idx], d=done();
  S.set('pos:'+deck.key,idx); location.hash=deck.key+'/'+encodeURIComponent(c.name);
  $('title').textContent=c.title; $('prob').value=String(idx); $('topic').value=c.topic;
  $('tags').innerHTML=(c.rating?`<span class="tag rt ${rcls(c.rating)}" title="${esc(c.why)}">★ ${c.rating}/10</span>`:'')+[c.topic,c.technique,c.lc,c.difficulty,deck.key==='all'?c.dl:'',c.alt_of?'↪ alternate':'',c.note?'⚠ has error':''].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  $('desc').innerHTML=(c.problem?`<p class="k">Problem</p><p>${esc(c.problem)}</p>`:'')+(c.covers?`<p class="k">Card covers</p><p>${esc(c.covers)}</p>`:'')+(!c.problem&&!c.covers?`<p>${esc(c.name)}</p>`:'')+(c.why?`<p class="why">Likelihood ${c.rating}/10 — ${esc(c.why)}</p>`:'')+(c.note?`<div class="warn">⚠️ <b>Card error:</b> ${esc(c.note)}</div>`:'')
    +(c.alt_of?`<div class="altbox">↪ <b>Alternate solution</b> (more complex) — prefer <a data-go="${c.alt_of.dk}/${esc(c.alt_of.name)}">${esc(c.alt_of.title)}</a>. ${esc(c.alt_reason||'')}</div>`:'')
    +(c.alts?c.alts.map(a=>`<div class="altbox">✓ <b>Preferred (simpler) solution.</b> Also on the board: <a data-go="${a.dk}/${esc(a.name)}">${esc(a.title)} (alternate)</a>. ${esc(a.reason||'')}</div>`).join(''):'');
  $('img').src=c.file; $('img').alt=c.title; window.scrollTo(0,0);
  const key=dkey(c), isDone=!!d[key];
  $('mark').classList.toggle('on',isDone); $('mark').textContent=isDone?'☑ done':'☐ done';
  const inTopic=deck.cards.filter(x=>x.topic===c.topic), ti=inTopic.indexOf(c);
  const nDone=deck.cards.filter(x=>d[dkey(x)]).length;
  $('pos').innerHTML=`Card <b>${idx+1}</b> / ${deck.cards.length}`+(deck.cards.length<deck.all.length?` <span style="opacity:.7">(filtered from ${deck.all.length})</span>`:'');
  $('grp').innerHTML=`${esc(c.topic)}: <b>${ti+1}</b> / ${inTopic.length}`;
  $('donec').innerHTML=`Done <b>${nDone}</b> / ${deck.cards.length}`;
  [...$('strip').children].forEach((el,j)=>{const x=deck.cards[j];el.className=(d[dkey(x)]?'done ':'')+(j===idx?'cur ':'')+(x.topic===c.topic?'grp':'')});
  const pre=new Image(); if(deck.cards[idx+1]) pre.src=deck.cards[idx+1].file;
}
function setDeck(k,i){deck=DECKS.find(d=>d.key===k)||DECKS[0];S.set('deck',deck.key);applyView();fillDeck();fillLists();show(i??S.get('pos:'+deck.key,0))}
function refresh(){const cur=deck.cards[idx];applyView();fillLists();const j=cur?deck.cards.indexOf(cur):-1;show(j>=0?j:0)}
$('minr').onchange=e=>{minR=+e.target.value;S.set('minr',minR);refresh()};
$('order').onchange=e=>{order=e.target.value;S.set('order',order);refresh()};
$('deck').onchange=e=>setDeck(e.target.value,0);
$('topic').onchange=e=>{if(!e.target.value)return;show(deck.cards.findIndex(c=>c.topic===e.target.value))};
$('prob').onchange=e=>show(+e.target.value);
$('prev').onclick=$('prev2').onclick=()=>show(idx-1);
$('next').onclick=$('next2').onclick=()=>show(idx+1);
$('mark').onclick=()=>{const d=done(),c=deck.cards[idx],k=dkey(c);d[k]=!d[k];S.set('done',d);show(idx)};
$('alts').onclick=()=>{showAlt=!showAlt;S.set('alts',showAlt);fillDeck();refresh()};
function goTo(dk,name){const real=DECKS.find(d=>d.key===dk);let c=real&&real.all.find(x=>x.name===name);if(!c)return;
  if(c.alt_of&&!showAlt){showAlt=true;S.set('alts',true)}
  if(deck.key!=='all'&&deck!==real){deck=real;S.set('deck',deck.key)}
  applyView();if(deck.key==='all')c=deck.all.find(x=>x.name===name&&x.dk===dk);if(!deck.cards.includes(c)){minR=0;S.set('minr',0);applyView()}fillDeck();fillLists();show(deck.cards.indexOf(c))}
$('desc').addEventListener('click',e=>{const a=e.target.closest('a[data-go]');if(!a)return;const [dk,...n]=a.dataset.go.split('/');goTo(dk,n.join('/'))});
$('strip').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined)show(+i)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey)return;
  if(e.key==='ArrowRight'||e.key==='l'){show(idx+1);e.preventDefault()} else if(e.key==='ArrowLeft'||e.key==='h'){show(idx-1);e.preventDefault()}
  else if(e.key==='d'||e.key==='D'){$('mark').click()}});
const ALL=[];DECKS.filter(d=>d.key!=='all').forEach(d=>d.all.forEach((c,i)=>ALL.push({d,i,c,hay:[c.alt_of?'alternate':'',c.title,c.lc,c.name,c.topic,c.technique,c.problem,c.covers,d.label].join(' ').toLowerCase()})));
let hits=[],sel=0;
function hl(t,terms){let o=esc(t);terms.forEach(w=>{if(w)o=o.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return o}
function runSearch(){const q=$('q').value.trim().toLowerCase();const r=$('res');
  if(!q){r.hidden=true;hits=[];return}
  const terms=q.split(/\s+/);
  hits=ALL.map(x=>{if(!terms.every(t=>x.hay.includes(t)))return null;const t=x.c.title.toLowerCase();
      let score=0;terms.forEach(w=>{if(t.startsWith(w))score+=5;else if(t.includes(w))score+=3;if((x.c.lc||'').toLowerCase().replace(' ','')===w.replace(' ','')||(x.c.lc||'').toLowerCase().endsWith(' '+w))score+=8;if(x.c.topic===w)score+=2});
      if(x.d===deck)score+=1;return{...x,score}}).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,40);
  sel=0;r.hidden=false;
  r.innerHTML=hits.length?hits.map((x,j)=>`<a data-j="${j}" class="${j===0?'sel':''}">${hl(x.c.title,terms)} <small>· ${esc(x.c.topic)}${x.c.lc?' · '+esc(x.c.lc):''}${x.c.difficulty?' · '+esc(x.c.difficulty):''}${x.c.rating?' · ★'+x.c.rating:''}${x.c.alt_of?' · alternate':''} · ${esc(x.d.label)}</small></a>`).join(''):'<div class="none">No matches</div>';}
function pick(j){const x=hits[j];if(!x)return;$('res').hidden=true;$('q').value='';$('q').blur();
  const target=deck.key==='all'?deck:x.d; if(target!==deck){deck=target;S.set('deck',deck.key)}
  if(x.c.alt_of&&!showAlt){showAlt=true;S.set('alts',true)}
  applyView(); const c=deck.key==='all'?deck.all.find(y=>y.name===x.c.name&&y.dk===x.c.dk):x.c;
  if(!deck.cards.includes(c)){minR=0;S.set('minr',0);applyView()} fillDeck();fillLists();show(deck.cards.indexOf(c))}
$('q').addEventListener('input',runSearch);
$('q').addEventListener('keydown',e=>{const items=[...$('res').querySelectorAll('a')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!items.length)return;e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((a,k)=>a.classList.toggle('sel',k===sel));items[sel].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();pick(sel)} else if(e.key==='Escape'){$('q').value='';$('res').hidden=true;$('q').blur()}});
$('res').addEventListener('mousedown',e=>{const a=e.target.closest('a');if(a){e.preventDefault();pick(+a.dataset.j)}});
$('q').addEventListener('blur',()=>setTimeout(()=>{$('res').hidden=true},150));
$('q').addEventListener('focus',()=>{if($('q').value.trim())runSearch()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}});
const h=decodeURIComponent(location.hash.slice(1)).split('/');
if(h[0]&&DECKS.find(d=>d.key===h[0])){const dk=DECKS.find(d=>d.key===h[0]);deck=dk;applyView();const i=deck.cards.findIndex(c=>c.name===h[1]);setDeck(h[0],i>=0?i:0)}else setDeck(deck.key);
</script></body></html>
